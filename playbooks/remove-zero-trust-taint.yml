---
- name: Remove Zero-Trust Firewall Taint
  hosts: localhost
  gather_facts: false
  vars:
    target_node: "{{ target_node }}"
    validate_certs: false

  tasks:
    - name: Remove taint from node
      kubernetes.core.k8s_taint:
        name: "{{ target_node }}"
        validate_certs: "{{ validate_certs }}"
        state: absent
        taints:
          - key: "network.zero-trust.io/firewall-unverified"
            value: "true"
            effect: "NoSchedule"
