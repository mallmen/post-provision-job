---
- name: Remove Zero-Trust Firewall Taint
  hosts: localhost
  gather_facts: false
  vars:
    target_node: "{{ target_node }}"
    validate_certs: false

  tasks:
    - name: Remove taint from Machine resource
      kubernetes.core.k8s:
        validate_certs: "{{ validate_certs }}"
        api_version: machine.openshift.io/v1beta1
        kind: Machine
        name: "{{ target_node }}"
        namespace: openshift-machine-api
        state: present
        definition:
          spec:
            taints: []

