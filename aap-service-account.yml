apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-automation
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aap-node-taint-manager
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aap-node-taint-manager-binding
subjects:
  - kind: ServiceAccount
    name: aap-automation
    namespace: default
roleRef:
  kind: ClusterRole
  name: aap-node-taint-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: aap-automation-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: aap-automation
type: kubernetes.io/service-account-token
